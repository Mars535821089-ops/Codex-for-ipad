[package]
name = "codex-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "codex_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22"
bytes = "1"
codex-api = { git = "https://github.com/openai/codex", rev = "ffe1de5cec9c0cd02629eb246534e4622da0ff41" }
codex-client = { package = "codex-http-client", git = "https://github.com/openai/codex", rev = "ffe1de5cec9c0cd02629eb246534e4622da0ff41" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "ffe1de5cec9c0cd02629eb246534e4622da0ff41" }
codex-utils-stream-parser = { path = "vendor/codex-utils-stream-parser" }
futures = "0.3"
flate2 = "1"
gix = { version = "=0.81.0", default-features = false, features = ["sha1", "excludes", "blob-diff", "blame", "tree-editor", "revision"] }
gix-config = "=0.54.0"
git2 = { version = "=0.20.4", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
http = "1.3.1"
reqwest = { version = "0.12", features = ["cookies", "rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
