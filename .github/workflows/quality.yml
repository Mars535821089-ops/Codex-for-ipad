name: Public source quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test runner
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Public repository safety
        run: python3 scripts/verify_public_repository.py
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Public build and product contracts
        run: |
          python3 -m pytest -q \
            tests/test_auto_update_disabled_contract.py \
            tests/test_generate_codexpad_xcode_project.py \
            tests/test_model_catalog_generation.py \
            tests/test_ipad_execution_contract.py \
            tests/test_physical_acceptance_gate.py
      - name: Rust core tests
        run: cargo test --locked --manifest-path CodexCore/Cargo.toml
